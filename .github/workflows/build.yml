name: Build calendars

on:
  workflow_dispatch:
    inputs:
      scrape:
        description: "Scrape swiss-streethockey.ch before building"
        type: boolean
        default: true
      commit:
        description: "Commit refreshed data and calendars back to the branch"
        type: boolean
        default: true
      deploy:
        description: "Publish docs/ to GitHub Pages"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs fight over the branch or the Pages deployment.
concurrency:
  group: build-calendars
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape the game center
        if: ${{ inputs.scrape }}
        run: python scripts/scrape.py

      - name: Build the site
        run: python scripts/build_site.py

      - name: Check the generated calendars
        run: python -m unittest discover -s tests -v

      - name: Commit refreshed data and calendars
        id: commit
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed."
          else
            git commit -m "Refresh calendars from the game center"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the Pages artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
